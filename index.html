  let order=[],i=0,score=0,wrong=[],locked=false;
  const $=id=>document.getElementById(id), letters=['A','B','C','D'];
  function shuffle(a){for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}
  function begin(){order=shuffle([...questions.keys()]).slice(0,ROUND_SIZE);i=0;score=0;wrong=[];$('start').style.display='none';$('result').style.display='none';$('quiz').style.display='block';$('topPill').textContent=`0 / ${ROUND_SIZE}`;show()}
  function show(){locked=false;const x=questions[order[i]];$('counter').textContent=`第 ${i+1} / ${order.length} 題`;$('score').textContent=score;$('topPill').textContent=`${score} / ${ROUND_SIZE}`;$('bar').style.width=`${(i/order.length)*100}%`;$('season').textContent=x.s;$('question').textContent=x.q;$('feedback').style.display='none';$('feedback').className='feedback';$('nextBtn').style.display='none';const box=$('options');box.innerHTML='';x.o.forEach((v,k)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<span class="letter">${letters[k]}</span><span>${v}</span><span class="icon"></span>`;b.addEventListener('click',()=>answer(k,b));box.appendChild(b)})}
  function answer(k,btn){if(locked)return;locked=true;const x=questions[order[i]],buttons=[...document.querySelectorAll('.option')];buttons.forEach((b,n)=>{b.disabled=true;if(n===x.a){b.classList.add('correct');b.querySelector('.icon').textContent='✓'}});const ok=k===x.a;if(ok){score++;$('feedbackTitle').textContent='答啱！';}else{btn.classList.add('wrong');btn.querySelector('.icon').textContent='×';wrong.push(order[i]);$('feedbackTitle').textContent=`正確答案：${letters[x.a]}. ${x.o[x.a]}`;$('feedback').classList.add('wrongfeed')}$('score').textContent=score;$('topPill').textContent=`${score} / ${ROUND_SIZE}`;$('explanation').textContent=x.e;$('source').href=x.u;$('feedback').style.display='block';$('nextBtn').textContent=i===order.length-1?'睇成績 →':'下一題 →';$('nextBtn').style.display='block';$('bar').style.width=`${((i+1)/order.length)*100}%`;setTimeout(()=>$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'}),80)}
  function next(){i++;if(i>=order.length)return finish();show();window.scrollTo({top:0,behavior:'smooth'})}
  function finish(){$('quiz').style.display='none';$('result').style.display='block';$('finalScore').textContent=score;$('topPill').textContent=`${score} / ${ROUND_SIZE}`;const pct=score/ROUND_SIZE;$('rating').textContent=pct>=.9?'雙紅會資料庫級！曼聯利記十年往事都難你唔到。':pct>=.7?'資深雙紅球迷！大部分經典你都記得。':pct>=.5?'有睇開波，但仲有幾季要補課。':'再踢多場！每次都會重新抽 10 題。';window.scrollTo({top:0,behavior:'smooth'})}
  $('startBtn').addEventListener('click',begin);$('nextBtn').addEventListener('click',next);$('retryBtn').addEventListener('click',begin);
  const context=document.modelContext;
  if(context?.registerTool){
    const lifecycle=new AbortController();
    Promise.resolve(context.registerTool({name:'start_premier_league_quiz',title:'開始雙紅會十年考',description:'由 40 題庫隨機抽 10 題，開始曼聯利物浦四選一測驗。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(){begin();return{status:'started',questionCount:ROUND_SIZE,poolSize:questions.length,currentQuestion:questions[order[i]].q}}},{signal:lifecycle.signal})).catch(()=>{});
    Promise.resolve(context.registerTool({name:'answer_current_quiz_question',title:'回答目前題目',description:'以 A、B、C 或 D 回答目前顯示的英超題目。',inputSchema:{type:'object',properties:{answer:{type:'string',enum:['A','B','C','D']}},required:['answer'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if($('quiz').style.display!=='block')throw new Error('測驗尚未開始');if(locked)throw new Error('本題已回答');const k=letters.indexOf(input.answer);if(k<0)throw new Error('答案必須是 A、B、C 或 D');const before=score;document.querySelectorAll('.option')[k].click();return{correct:score>before,score,questionNumber:i+1,explanation:questions[order[i]].e}}},{signal:lifecycle.signal})).catch(()=>{});
  }
  </script>
</body>
</html>
